<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="EMS Transportes e Logistica - transporte rodoviario, cargas fracionadas, lotacao, distribuicao e rastreamento."
    />
    <title>EMS Transportes e Logistica</title>
    <script>
      (function () {
        if ('scrollRestoration' in history) {
          history.scrollRestoration = 'manual';
        }

        var navigation = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
        if (window.location.hash && navigation && navigation.type === 'reload') {
          history.replaceState(null, document.title, window.location.pathname + window.location.search);
          window.scrollTo(0, 0);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
